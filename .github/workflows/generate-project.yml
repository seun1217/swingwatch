name: generate-project

# XcodeGen이 만든 SwingWatch.xcodeproj를 저장소에 커밋해 둔다.
# 덕분에 Xcode를 처음 쓰는 사람도 Homebrew/터미널 없이 프로젝트를 바로 열 수 있다.
# project.yml이 바뀌면 자동으로 다시 생성된다.

on:
  workflow_dispatch:
  push:
    paths:
      - "project.yml"
      - ".github/workflows/generate-project.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project builds
        run: |
          set -o pipefail
          xcodebuild build \
            -project SwingWatch.xcodeproj \
            -scheme SwingWatch \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            | tail -20

      - name: Check watch app is embedded under Watch/
        run: |
          # Xcode(Swift Build)의 표준 위치. 이 위치여야 iPhone Watch 앱의
          # '사용 가능한 앱'에 나타나고 워치로 설치된다.
          test -d dd/Build/Products/Debug-iphonesimulator/SwingWatch.app/Watch/SwingWatchWatch.app
          grep -q 'dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";' SwingWatch.xcodeproj/project.pbxproj

      - name: Commit generated project
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f SwingWatch.xcodeproj
          if git diff --cached --quiet; then
            echo "생성된 프로젝트에 변경 사항이 없습니다."
            exit 0
          fi
          git commit -m "생성된 SwingWatch.xcodeproj 커밋 (터미널 없이 바로 열기)

          project.yml로부터 XcodeGen이 생성한 프로젝트 파일(워치 앱은
          표준 위치인 Watch/에 임베드). project.yml이 바뀌면 이 워크플로가
          다시 생성해 커밋한다."
          git push origin HEAD:${GITHUB_REF_NAME}
