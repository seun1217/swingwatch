name: watch-embed-experiment

# 워치 앱을 iPhone 앱의 Watch/ 와 PlugIns/ 중 어디에 넣어야 실제로 설치되는지
# Xcode 26 + 짝지은 시뮬레이터(iPhone ↔ Apple Watch)로 직접 확인하는 실험.
# 결과는 각 작업의 Summary 표에 기록된다.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/watch-embed-experiment.yml"

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
        layout: [Watch, PlugIns]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$X" ] || X="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | head -1)" >> "$GITHUB_ENV"

      - name: List simulator runtimes
        run: xcrun simctl list runtimes

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Apply PlugIns layout
        if: matrix.layout == 'PlugIns'
        run: |
          /usr/bin/sed -i '' \
            -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' \
            -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' \
            SwingWatch.xcodeproj/project.pbxproj

      - name: Show embed phase
        run: grep -n -B2 -A10 "Embed Watch Content" SwingWatch.xcodeproj/project.pbxproj | head -40

      - name: Build for iOS Simulator
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project SwingWatch.xcodeproj -scheme SwingWatch -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -25
          echo "--- validation-related lines ---"
          grep -iE "PlugIns directory|Watch directory|ValidateEmbeddedBinary|embedded binary" build.log | head -20 || true

      - name: Build for iOS device (unsigned)
        id: devicebuild
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project SwingWatch.xcodeproj -scheme SwingWatch -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath dd-device \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee device-build.log | tail -25
          grep -iE "PlugIns directory|Watch directory|ValidateEmbeddedBinary|embedded binary|is not installed" device-build.log | head -20 || true

      - name: Inspect bundle and bundle IDs
        if: steps.build.outcome == 'success'
        run: |
          APP=dd/Build/Products/Debug-iphonesimulator/SwingWatch.app
          find "$APP" -maxdepth 2 -name "*.app" -print
          PB=/usr/libexec/PlistBuddy
          echo "iOS CFBundleIdentifier: $($PB -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          W="$(find "$APP" -maxdepth 2 -name 'SwingWatchWatch.app' | head -1)"
          echo "watch app: $W"
          echo "watch CFBundleIdentifier: $($PB -c 'Print :CFBundleIdentifier' "$W/Info.plist")"
          echo "watch WKCompanionAppBundleIdentifier: $($PB -c 'Print :WKCompanionAppBundleIdentifier' "$W/Info.plist")"

      - name: Install on paired simulators
        id: install
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          python3 - <<'PY' > sims.env
          import json, subprocess
          rts = json.loads(subprocess.check_output(["xcrun","simctl","list","runtimes","-j"]))["runtimes"]
          def newest(plat):
              c = [r for r in rts if r.get("isAvailable") and r.get("platform") == plat]
              c.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
              return c[-1] if c else None
          ios, watch = newest("iOS"), newest("watchOS")
          def dtype(rt, prefix):
              names = [d["name"] for d in rt.get("supportedDeviceTypes", []) if d["name"].startswith(prefix)]
              return names[-1] if names else ""
          print(f'IOS_RT="{ios["identifier"] if ios else ""}"')
          print(f'WATCH_RT="{watch["identifier"] if watch else ""}"')
          print(f'IOS_DT="{dtype(ios, "iPhone") if ios else ""}"')
          print(f'WATCH_DT="{dtype(watch, "Apple Watch") if watch else ""}"')
          PY
          cat sims.env
          . ./sims.env
          if [ -z "$IOS_RT" ] || [ -z "$WATCH_RT" ]; then
            echo "RESULT_INSTALL=no-runtime" >> "$GITHUB_ENV"; exit 0
          fi
          PHONE=$(xcrun simctl create exp-phone "$IOS_DT" "$IOS_RT")
          WATCH=$(xcrun simctl create exp-watch "$WATCH_DT" "$WATCH_RT")
          PAIR=$(xcrun simctl pair "$WATCH" "$PHONE")
          xcrun simctl boot "$PHONE"
          xcrun simctl boot "$WATCH"
          xcrun simctl pair_activate "$PAIR" || true
          xcrun simctl bootstatus "$PHONE" -b || true
          xcrun simctl bootstatus "$WATCH" -b || true
          APP=dd/Build/Products/Debug-iphonesimulator/SwingWatch.app
          if xcrun simctl install "$PHONE" "$APP" 2> install.err; then
            echo "RESULT_PHONE_INSTALL=ok" >> "$GITHUB_ENV"
          else
            echo "RESULT_PHONE_INSTALL=FAILED: $(tr '\n' ' ' < install.err | cut -c1-300)" >> "$GITHUB_ENV"
            cat install.err
          fi
          FOUND=no
          for i in $(seq 1 24); do
            if xcrun simctl listapps "$WATCH" 2>/dev/null | grep -q "com.seun1217.swingwatch.watchkitapp"; then FOUND=yes; break; fi
            sleep 5
          done
          echo "RESULT_WATCH_AUTO=$FOUND" >> "$GITHUB_ENV"
          echo "watch apps:"; xcrun simctl listapps "$WATCH" | grep -i CFBundleIdentifier | head -40

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.runner }} · layout=${{ matrix.layout }} · ${XCODE_VERSION:-?}"
            echo "| step | result |"
            echo "|---|---|"
            echo "| simulator build | ${{ steps.build.outcome }} |"
            echo "| device build (unsigned) | ${{ steps.devicebuild.outcome }} |"
            echo "| install on iPhone sim | ${RESULT_PHONE_INSTALL:-n/a} |"
            echo "| watch app auto-installed on paired watch sim | ${RESULT_WATCH_AUTO:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SUMMARY runner=${{ matrix.runner }} layout=${{ matrix.layout }} xcode='${XCODE_VERSION:-?}' build=${{ steps.build.outcome }} devicebuild=${{ steps.devicebuild.outcome }} phone_install='${RESULT_PHONE_INSTALL:-n/a}' watch_auto=${RESULT_WATCH_AUTO:-n/a}"
