# XcodeGen 프로젝트 정의.
# 사용법: Scripts/bootstrap.sh 실행 (= xcodegen generate). 보통은 CI가 자동으로 다시 생성한다.
name: SwingWatch

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 번들 ID 앞부분. iPhone 앱·워치 앱·워치 Info.plist가 모두 이 값을 따라가므로
    # "이미 사용 중인 ID" 에러가 나면 이 한 줄만 바꾸면 된다(설치 스크립트도 이 값을 덮어쓴다).
    BUNDLE_ID_PREFIX: com.seun1217
    # 개인 팀으로 빌드하려면 Xcode의 Signing & Capabilities에서 팀만 선택하면 된다.

targets:
  SwingWatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SwingWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).swingwatch
        INFOPLIST_FILE: SwingWatch/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
    dependencies:
      - target: SwingWatchWatch
        embed: true

  SwingWatchWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SwingWatchWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).swingwatch.watchkitapp
        INFOPLIST_FILE: SwingWatchWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"

  SwingWatchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # 순수 로직 파일을 직접 컴파일하므로 호스트 앱 없이 돌아가는 로직 테스트다.
      - path: Tests
      - path: SwingWatch/Analysis
      - path: SwingWatch/Pose/PoseFrame.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).swingwatch.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  SwingWatch:
    build:
      targets:
        SwingWatch: all
        SwingWatchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwingWatchTests
  SwingWatchWatch:
    build:
      targets:
        SwingWatchWatch: all
    run:
      config: Debug
